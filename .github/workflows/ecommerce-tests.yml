name: E-commerce UI Tests

on:
  push:
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run e-commerce UI tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Generate Allure HTML report
        if: always()
        run: mvn --batch-mode --no-transfer-progress allure:report

      - name: Upload Allure report, results, and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-test-report-${{ github.run_number }}
          path: |
            target/site/allure-maven-plugin/
            target/allure-results/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
